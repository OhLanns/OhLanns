name: Generate Snake Contribution Animation

on:
  schedule:
    # Berjalan otomatis setiap 12 jam (cron)
    - cron: "0 */12 * * *"
  
  # Bisa dijalankan secara manual kapan saja via tab Actions
  workflow_dispatch:
  
  # Jalankan otomatis setiap kali ada push ke branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Membuat animasi snake dari commit history / kontribusi GitHub
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: OhLanns
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push file svg ke branch "output"
      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
